<vbox id="litmag-prefpane" class="litmag-prefpane"
      onload="if (window.LitMagPrefs) window.LitMagPrefs.bind()">
  <!-- Zotero 10 inserts this file as a XUL fragment into the preferences
       document. A leading declaration or extra namespace attributes make the
       fragment parser fail with "not well-formed XML" and the whole pane
       disappears. Namespaces come from the host document (html: prefix), and
       scripts/stylesheets come from PreferencePanes.register. Keep this root
       element bare: no declaration, no namespace, no inline script. -->

  <groupbox>
    <caption label="模型与接口（由你自己填写，插件不内置任何密钥）" />
    <hbox align="center" class="litmag-pref-row">
      <label value="服务商" class="litmag-pref-label" />
      <menulist id="litmag-provider" native="true">
        <menupopup>
          <menuitem value="openai" label="OpenAI 兼容（OpenAI / DeepSeek / 硅基流动 / 智谱 / Moonshot / Qwen / Ollama / LM Studio / 中转）" />
          <menuitem value="anthropic" label="Anthropic（/v1/messages）" />
          <menuitem value="custom" label="自定义完整端点（OpenAI 格式）" />
        </menupopup>
      </menulist>
    </hbox>
    <hbox align="center" class="litmag-pref-row">
      <label value="Base URL" class="litmag-pref-label" />
      <html:input id="litmag-base-url" type="text" class="litmag-pref-input"
                  placeholder="https://api.openai.com/v1" />
    </hbox>
    <hbox align="center" class="litmag-pref-row">
      <html:input id="litmag-full-url" type="checkbox" />
      <label value="上面填写的是完整端点（不再自动拼接 /v1/chat/completions）" />
    </hbox>
    <hbox align="center" class="litmag-pref-row">
      <label value="API Key" class="litmag-pref-label" />
      <html:input id="litmag-api-key" type="password" class="litmag-pref-input"
                  placeholder="sk-…（本地模型可留空）" />
    </hbox>
    <hbox align="center" class="litmag-pref-row">
      <label value="模型名称" class="litmag-pref-label" />
      <html:input id="litmag-model" type="text" class="litmag-pref-input"
                  placeholder="gpt-4o-mini / deepseek-chat / Qwen/Qwen3-8B …" />
      <html:button id="litmag-fetch-models" class="litmag-btn litmag-btn-mini">获取模型列表</html:button>
    </hbox>
    <hbox align="center" class="litmag-pref-row">
      <label value="温度" class="litmag-pref-label" />
      <html:input id="litmag-temperature" type="text" class="litmag-pref-small" />
      <label value="最大 tokens" />
      <html:input id="litmag-max-tokens" type="text" class="litmag-pref-small" />
      <html:input id="litmag-stream" type="checkbox" />
      <label value="流式输出" />
    </hbox>
    <hbox align="baseline" class="litmag-pref-row">
      <label value="系统提示词" class="litmag-pref-label" />
      <html:textarea id="litmag-system-prompt" rows="4" class="litmag-pref-input"></html:textarea>
    </hbox>
  </groupbox>

  <groupbox>
    <caption label="发送给模型的文献上下文" />
    <hbox align="center" class="litmag-pref-row">
      <label value="上下文预算（字符）" class="litmag-pref-label" />
      <html:input id="litmag-context-chars" type="text" class="litmag-pref-small" />
      <label value="保留对话轮数" />
      <html:input id="litmag-history-turns" type="text" class="litmag-pref-small" />
    </hbox>
    <hbox align="center" class="litmag-pref-row">
      <html:input id="litmag-include-fulltext" type="checkbox" />
      <label value="附带 PDF 全文" />
      <html:input id="litmag-include-annotations" type="checkbox" />
      <label value="附带标注与批注" />
      <html:input id="litmag-include-notes" type="checkbox" />
      <label value="附带已有子笔记" />
    </hbox>
  </groupbox>

  <groupbox>
    <caption label="配置档（可保存多套模型设置并快速切换）" />
    <hbox align="center" class="litmag-pref-row">
      <menulist id="litmag-profiles" native="true"><menupopup /></menulist>
      <html:button id="litmag-profile-apply" class="litmag-btn litmag-btn-mini">应用</html:button>
      <html:button id="litmag-profile-save" class="litmag-btn litmag-btn-mini">保存当前为…</html:button>
      <html:button id="litmag-profile-delete" class="litmag-btn litmag-btn-mini">删除</html:button>
    </hbox>
  </groupbox>

  <groupbox>
    <caption label="保存与验证" />
    <hbox align="center" class="litmag-pref-row">
      <html:button id="litmag-save" class="litmag-btn litmag-btn-primary">保存设置</html:button>
      <html:button id="litmag-test" class="litmag-btn">测试连接</html:button>
      <label id="litmag-status" value="" flex="1" />
    </hbox>
    <description class="litmag-pref-note">
      所有请求由 Zotero 直接发往你填写的接口；不需要启动任何外部程序或本地服务。密钥仅保存在本机 Zotero 配置中，请勿共享配置文件。
    </description>
    <description class="litmag-pref-note">
      LitMag v2.0.1 · 仅支持 Zotero 10 · https://github.com/zhaojiayuan19981123/litmag
    </description>
  </groupbox>
</vbox>
