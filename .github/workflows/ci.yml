name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Build self-contained XPI
        run: node scripts/build-xpi.mjs
      - name: Run unit and HTTP end-to-end tests
        run: node --test
      - name: Verify build metadata
        run: node -e "console.log(require('./dist/build-info.json').version)"
